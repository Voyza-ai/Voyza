name: CI

# `dev` auto-deploys to voyza-dev.vercel.app and `voyza_main` auto-deploys to
# Vercel production + Railway, so anything merged into either branch ships
# itself. Run the suites on the PR (before the merge) and again on the push
# (after it), so a red merge is visible rather than silently deployed.
on:
  pull_request:
    branches:
      - dev
      - voyza_main
  push:
    branches:
      - dev
      - voyza_main

# Only the newest run per branch/PR matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # frontend/ and backend/ are two separate npm projects in subdirectories
  # (no root package.json, no npm workspaces) — each has its own
  # package-lock.json, so each gets its own job, its own install and its own
  # cache key. Separate jobs also mean a frontend failure still reports the
  # backend's real result instead of masking it.
  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: no `engines` field in either package.json, so the floor comes
      # from the installed toolchain — @supabase/supabase-js needs >=20,
      # Next 14.2.21 needs >=18.17, and Jest 30 only accepts
      # ^18.14 || ^20 || ^22 || >=24 (it rejects odd majors like 23). Node 22
      # is the newest LTS inside all three, and it is what the dev container
      # runs (22.22.0), so CI reproduces what a developer sees locally.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Runs before the build on purpose: tsconfig.json covers **/*.ts(x),
      # including src/__tests__, which `next build` does not typecheck.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: backend (Express)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # backend/src/config/env.ts validates env with zod at import time and
    # calls process.exit(1) if it fails: SUPABASE_URL must parse as a URL and
    # SUPABASE_SERVICE_ROLE_KEY must be non-empty. These are deliberately
    # throwaway placeholders, NOT repository secrets — CI must never be able
    # to reach the real Supabase project, which holds live trip data. Any test
    # that needs a database should mock it; if one ever starts failing because
    # these are fake, that test is the bug.
    env:
      SUPABASE_URL: https://ci-not-a-real-project.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-not-a-real-credential
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
